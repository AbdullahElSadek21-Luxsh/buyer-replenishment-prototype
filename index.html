<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark"><title>Replenish — Buyer Replenishment Prototype</title>
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0}img,svg{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
#themeToggle{position:fixed;right:14px;bottom:14px;z-index:80;display:flex;align-items:center;gap:7px;
background:var(--surface);color:var(--ink-soft);border:1px solid var(--line-strong);border-radius:999px;
padding:8px 13px;font-size:12px;font-weight:600;cursor:pointer;
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
box-shadow:0 2px 4px rgba(16,22,32,.08),0 8px 20px rgba(16,22,32,.10)}
#themeToggle:hover{color:var(--ink);border-color:var(--ink-faint)}#themeToggle svg{width:14px;height:14px}
@media print{#themeToggle{display:none}}</style></head><body>
<style>
:root{
  --bg:#DFE4EC; --surface:#FFFFFF; --surface-2:#EFF2F6; --surface-3:#DDE2EA;
  --header:#F7F9FB;
  --ink:#111620; --ink-soft:#495160; --ink-faint:#6F7887;
  --line:#CBD3DE; --line-strong:#A9B3C2;
  --accent:#1B3A5C; --accent-ink:#12293F; --accent-soft:#DCE4EE; --accent-contrast:#FFFFFF;
  --low:#8B6914; --low-soft:#F3EDDC; --out:#9E2B25; --out-soft:#F6E1DF;
  --fast:#0F6E7A; --fast-soft:#DBEBED; --slow:#565A72; --slow-soft:#E5E6EC;
  --shadow-s:0 1px 2px rgba(16,22,32,.05);
  --shadow-m:0 2px 4px rgba(16,22,32,.05),0 8px 20px rgba(16,22,32,.07);
  --shadow-l:0 8px 24px rgba(16,22,32,.12),0 24px 60px rgba(16,22,32,.14);
  --r-s:5px; --r-m:7px; --r-l:10px;
  --mono:ui-monospace,"SFMono-Regular","Cascadia Code",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#080B10; --surface:#171D26; --surface-2:#212833; --surface-3:#2C3441;
  --header:#141A23;
  --ink:#E9EDF3; --ink-soft:#A5ADBB; --ink-faint:#7B8391;
  --line:#2E3641; --line-strong:#414B59;
  --accent:#7BA5D0; --accent-ink:#9CC0E4; --accent-soft:#17273A; --accent-contrast:#0B1520;
  --low:#D2A649; --low-soft:#2B2413; --out:#DE7168; --out-soft:#321A18;
  --fast:#58AEB8; --fast-soft:#0F292D; --slow:#9AA0BC; --slow-soft:#21242E;
  --shadow-s:0 1px 2px rgba(0,0,0,.3);
  --shadow-m:0 2px 4px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.3);
  --shadow-l:0 8px 24px rgba(0,0,0,.45),0 24px 60px rgba(0,0,0,.5);
}}
:root[data-theme="light"]{
  --bg:#DFE4EC; --surface:#FFFFFF; --surface-2:#EFF2F6; --surface-3:#DDE2EA;
  --header:#F7F9FB;
  --ink:#111620; --ink-soft:#495160; --ink-faint:#6F7887;
  --line:#CBD3DE; --line-strong:#A9B3C2;
  --accent:#1B3A5C; --accent-ink:#12293F; --accent-soft:#DCE4EE; --accent-contrast:#FFFFFF;
  --low:#8B6914; --low-soft:#F3EDDC; --out:#9E2B25; --out-soft:#F6E1DF;
  --fast:#0F6E7A; --fast-soft:#DBEBED; --slow:#565A72; --slow-soft:#E5E6EC;
  --shadow-s:0 1px 2px rgba(16,22,32,.05);
  --shadow-m:0 2px 4px rgba(16,22,32,.05),0 8px 20px rgba(16,22,32,.07);
  --shadow-l:0 8px 24px rgba(16,22,32,.12),0 24px 60px rgba(16,22,32,.14);
}
:root[data-theme="dark"]{
  --bg:#080B10; --surface:#171D26; --surface-2:#212833; --surface-3:#2C3441;
  --header:#141A23;
  --ink:#E9EDF3; --ink-soft:#A5ADBB; --ink-faint:#7B8391;
  --line:#2E3641; --line-strong:#414B59;
  --accent:#7BA5D0; --accent-ink:#9CC0E4; --accent-soft:#17273A; --accent-contrast:#0B1520;
  --low:#D2A649; --low-soft:#2B2413; --out:#DE7168; --out-soft:#321A18;
  --fast:#58AEB8; --fast-soft:#0F292D; --slow:#9AA0BC; --slow-soft:#21242E;
  --shadow-s:0 1px 2px rgba(0,0,0,.3);
  --shadow-m:0 2px 4px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.3);
  --shadow-l:0 8px 24px rgba(0,0,0,.45),0 24px 60px rgba(0,0,0,.5);
}
/* text that sits on a saturated status colour — dark statuses in light mode, light statuses in dark mode */
:root{--chip-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--chip-ink:#0B1016}}
:root[data-theme="light"]{--chip-ink:#FFFFFF}
:root[data-theme="dark"]{--chip-ink:#0B1016}

/* navy command rail — structural accent */
:root{--side-bg:#1B3A5C;--side-ink:#EDF2F8;--side-ink-soft:#A3B9D2;--side-line:rgba(255,255,255,.13);
      --side-hover:rgba(255,255,255,.07);--side-active:rgba(255,255,255,.14);--side-mark:#FFFFFF;--side-mark-ink:#1B3A5C}
@media (prefers-color-scheme:dark){:root{--side-bg:#0F1620;--side-ink:#E5EAF1;--side-ink-soft:#8E9BAC;
      --side-line:rgba(255,255,255,.09);--side-hover:rgba(255,255,255,.055);--side-active:rgba(255,255,255,.11);
      --side-mark:#7BA5D0;--side-mark-ink:#0B1520}}
:root[data-theme="light"]{--side-bg:#1B3A5C;--side-ink:#EDF2F8;--side-ink-soft:#A3B9D2;--side-line:rgba(255,255,255,.13);
      --side-hover:rgba(255,255,255,.07);--side-active:rgba(255,255,255,.14);--side-mark:#FFFFFF;--side-mark-ink:#1B3A5C}
:root[data-theme="dark"]{--side-bg:#0F1620;--side-ink:#E5EAF1;--side-ink-soft:#8E9BAC;
      --side-line:rgba(255,255,255,.09);--side-hover:rgba(255,255,255,.055);--side-active:rgba(255,255,255,.11);
      --side-mark:#7BA5D0;--side-mark-ink:#0B1520}
*{box-sizing:border-box}
body{margin:0}
.app{
  font-family:var(--sans); background:var(--bg); color:var(--ink);
  min-height:100vh; display:grid; grid-template-columns:264px 1fr;
  -webkit-font-smoothing:antialiased; line-height:1.5;
}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============ SIDEBAR ============ */
.side{
  background:var(--side-bg); border-right:1px solid var(--side-bg); color:var(--side-ink);
  display:flex; flex-direction:column; gap:22px; padding:20px 16px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.side :focus-visible{outline-color:var(--side-ink)}
.brand{display:flex; align-items:center; gap:10px; padding:2px 4px 16px; border-bottom:1px solid var(--side-line)}
.brand .mk{
  width:32px;height:32px;border-radius:var(--r-s);background:var(--side-mark);
  display:grid;place-items:center;color:var(--side-mark-ink);flex:none;
}
.brand .mk svg{width:18px;height:18px}
.brand .nm{font-size:15.5px;font-weight:700;letter-spacing:-.02em;line-height:1.1;color:var(--side-ink)}
.brand .sb{font-size:10px;color:var(--side-ink-soft);font-family:var(--mono);letter-spacing:.09em;text-transform:uppercase}

.fgroup{display:flex;flex-direction:column;gap:7px}
.flab{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-ink-soft);font-weight:600;padding-left:2px}
.sel{
  width:100%;appearance:none;background:var(--side-hover);border:1px solid var(--side-line);
  color:var(--side-ink);font-family:inherit;font-size:13px;font-weight:600;
  padding:10px 32px 10px 11px;border-radius:var(--r-s);cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23A3B9D2' stroke-width='2.5' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center;background-size:14px;
  transition:border-color .15s,background-color .15s;
}
.sel:hover{border-color:var(--side-ink-soft);background-color:var(--side-active)}
.sel option{background:var(--surface);color:var(--ink)}
.buyerCard{display:flex;align-items:center;gap:10px;background:var(--side-hover);border-radius:var(--r-s);padding:9px 11px;border:1px solid var(--side-line)}
.av{width:29px;height:29px;border-radius:50%;background:var(--side-mark);color:var(--side-mark-ink);display:grid;place-items:center;font-size:11px;font-weight:700;font-family:var(--mono);flex:none}
.buyerCard .bn{font-size:12.5px;font-weight:650;line-height:1.2;color:var(--side-ink)}
.buyerCard .br{font-size:10px;color:var(--side-ink-soft);font-family:var(--mono)}

nav.secs{display:flex;flex-direction:column;gap:2px}
.secBtn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;border-radius:var(--r-s);padding:9px 11px;cursor:pointer;
  font-family:inherit;font-size:12.5px;color:var(--side-ink-soft);font-weight:550;
  transition:background .14s,color .14s;
}
.secBtn:hover{background:var(--side-hover);color:var(--side-ink)}
.secBtn[aria-current="true"]{background:var(--side-active);color:var(--side-ink);font-weight:680}
.secBtn .dt{width:7px;height:7px;border-radius:50%;flex:none}
.secBtn .ct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--side-ink-soft);font-variant-numeric:tabular-nums}
.secBtn[aria-current="true"] .ct{color:var(--side-ink)}
.dt.low{background:var(--low)} .dt.out{background:var(--out)}
.dt.fast{background:var(--fast)} .dt.slow{background:var(--slow)}

.sideFoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:1px solid var(--side-line)}
.basketBtn{
  display:flex;align-items:center;gap:9px;width:100%;border:1px solid var(--side-line);
  background:var(--side-hover);border-radius:var(--r-s);padding:11px 12px;cursor:pointer;
  font-family:inherit;color:var(--side-ink);transition:border-color .15s,transform .12s,background .15s;
}
.basketBtn:hover{border-color:var(--side-ink-soft);background:var(--side-active)}
.basketBtn:active{transform:translateY(1px)}
.basketBtn .bt{font-size:12.5px;font-weight:680}
.basketBtn .bs{font-size:10.5px;color:var(--side-ink-soft);font-family:var(--mono)}
.pillN{margin-left:auto;background:var(--side-mark);color:var(--side-mark-ink);font-family:var(--mono);font-size:11px;font-weight:700;min-width:21px;height:21px;border-radius:11px;display:grid;place-items:center;padding:0 6px;font-variant-numeric:tabular-nums}
.pillN.zero{background:var(--side-line);color:var(--side-ink-soft)}
.protoNote{font-size:10px;color:var(--side-ink-soft);font-family:var(--mono);line-height:1.5;padding:9px 10px;background:var(--side-hover);border-radius:var(--r-s);border:1px solid var(--side-line)}

/* ============ MAIN ============ */
.main{min-width:0;display:flex;flex-direction:column}
.top{
  padding:22px 28px 0; display:flex;flex-direction:column;gap:18px;
  border-bottom:1px solid var(--line-strong); background:var(--header);
  box-shadow:0 1px 3px rgba(16,22,32,.06);
}
.topRow{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap}
.supTitle h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.022em;line-height:1.15}
.supTitle .meta{margin:5px 0 0;font-size:13px;color:var(--ink-soft)}
.supTitle .meta b{color:var(--ink);font-weight:650}
.search{margin-left:auto;position:relative;min-width:210px}
.search input{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-s);
  padding:9px 12px 9px 33px;font-family:inherit;font-size:13.5px;color:var(--ink);
}
.search input::placeholder{color:var(--ink-faint)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-faint)}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding-bottom:20px}
.tile{
  text-align:left;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--tc);
  border-radius:var(--r-m);padding:13px 14px;cursor:pointer;font-family:inherit;color:var(--ink);
  display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow-s);
  transition:transform .13s,box-shadow .15s,border-color .15s;
}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-m);border-color:var(--line-strong)}
.tile[aria-current="true"]{box-shadow:0 0 0 2px var(--tc) inset,var(--shadow-m);border-color:var(--line-strong)}
.tile .tv{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-.03em;color:var(--tc);font-variant-numeric:tabular-nums;line-height:1}
.tile .tl{font-size:12.5px;font-weight:600}
.tile .td{font-size:11px;color:var(--ink-faint)}
.tile.low{--tc:var(--low)} .tile.out{--tc:var(--out)}
.tile.fast{--tc:var(--fast)} .tile.slow{--tc:var(--slow)}

/* ============ LIST ============ */
.listWrap{padding:20px 28px 90px;display:flex;flex-direction:column;gap:9px}
.listHead{display:flex;align-items:center;gap:12px;padding:0 4px 2px}
.listHead h2{margin:0;font-size:15px;font-weight:680;letter-spacing:-.01em}
.listHead .hint{font-size:12px;color:var(--ink-faint);margin-left:auto}

.row{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);
  box-shadow:var(--shadow-s);overflow:hidden;border-left:3px solid var(--rc);
  transition:box-shadow .16s,border-color .16s;
}
.row:hover{box-shadow:var(--shadow-m)}
.row.open{box-shadow:var(--shadow-m);border-color:var(--line-strong);border-left-color:var(--rc)}
.row.low{--rc:var(--low)} .row.out{--rc:var(--out)}
.row.fast{--rc:var(--fast)} .row.slow{--rc:var(--slow)}

.rHead{
  display:grid;grid-template-columns:minmax(190px,2.1fr) 96px 104px 88px minmax(150px,1.15fr) 34px;
  gap:14px;align-items:center;padding:13px 15px;cursor:pointer;background:none;border:0;
  width:100%;text-align:left;font-family:inherit;color:var(--ink);
}
.rHead:hover{background:var(--surface-2)}
.pName{font-size:14px;font-weight:640;letter-spacing:-.008em;line-height:1.25}
.pCode{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-top:2px}
.cLab{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:3px}
.num{font-family:var(--mono);font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.cover{display:flex;flex-direction:column;gap:4px}
.coverBar{height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.coverBar i{display:block;height:100%;border-radius:2px;background:var(--rc)}
.badge{
  display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:5px;
}
.badge.low{background:var(--low-soft);color:var(--low)} .badge.out{background:var(--out-soft);color:var(--out)}
.badge.fast{background:var(--fast-soft);color:var(--fast)} .badge.slow{background:var(--slow-soft);color:var(--slow)}
.spark{width:100%;height:30px;display:block}
.bestBox{display:flex;flex-direction:column;gap:2px;min-width:0}
.bestSup{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bestNet{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.chev{color:var(--ink-faint);display:grid;place-items:center;transition:transform .22s}
.row.open .chev{transform:rotate(180deg)}
.chev svg{width:17px;height:17px}

/* expand */
.rBody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s ease}
.row.open .rBody{grid-template-rows:1fr}
.rBodyIn{overflow:hidden}
.bodyPad{padding:2px 15px 15px;border-top:1px solid var(--line);margin-top:0}
.bodyBar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 0 11px}
.kv{display:flex;flex-direction:column;gap:1px}
.kv .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint)}
.kv .v{font-family:var(--mono);font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
.rebNote{margin-left:auto;font-size:11px;color:var(--ink-faint);display:flex;align-items:center;gap:6px;font-family:var(--mono)}
.rebNote svg{width:13px;height:13px;flex:none}

/* ---- recommendation panel ---- */
.recPanel{
  display:grid;grid-template-columns:minmax(230px,1fr) minmax(240px,1.15fr);gap:0;
  border:1px solid var(--line);border-left:3px solid var(--rt);border-radius:var(--r-s);
  background:var(--surface-2);margin:13px 0 3px;overflow:hidden;
}
.recPanel.ok{--rt:var(--accent)} .recPanel.warn{--rt:var(--low)} .recPanel.urgent{--rt:var(--out)}
.recMain{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.recTop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.recTag{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  padding:3px 7px;border-radius:4px;background:var(--rt);color:var(--chip-ink)}
.recConf{margin-left:auto;display:flex;align-items:center;gap:7px;font-family:var(--mono);
  font-size:10.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums;cursor:help}
.confBar{width:44px;height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden;display:block}
.confBar i{display:block;height:100%;background:var(--rt);border-radius:2px}
.recLabel{font-size:15px;font-weight:680;letter-spacing:-.012em;line-height:1.25}
.recQty{font-size:12px;color:var(--ink-soft);font-family:var(--mono)}
.recQty b{color:var(--ink);font-variant-numeric:tabular-nums}
.recWhy{padding:12px 14px;border-left:1px solid var(--line);background:var(--surface)}
.whyTitle{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-faint);font-weight:650;margin-bottom:6px}
.recWhy ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.recWhy li{font-size:12.5px;color:var(--ink-soft);padding-left:15px;position:relative;line-height:1.4}
.recWhy li::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--rt);opacity:.65}
@media (max-width:720px){.recPanel{grid-template-columns:1fr}.recWhy{border-left:0;border-top:1px solid var(--line)}}

.tagStale{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.04em;
  background:var(--low-soft);color:var(--low);padding:2px 5px;border-radius:4px;margin-left:5px}

/* ---- per-row supplier actions ---- */
table.sup{min-width:760px}
.actCell{white-space:nowrap}
.actBtn{font-family:inherit;font-size:11px;font-weight:650;border-radius:5px;padding:5px 10px;cursor:pointer;
  border:1px solid transparent;transition:background .13s,border-color .13s,color .13s,box-shadow .13s}
.actBtn:active{transform:translateY(1px)}
.actBtn.po{background:var(--accent);color:var(--accent-contrast)}
.actBtn.po:hover{box-shadow:var(--shadow-s)}
.actBtn.ho{background:var(--surface-2);color:var(--fast);border-color:var(--line-strong)}
.actBtn.ho:hover{border-color:var(--fast)}
.actBtn.on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.actBtn.onho{background:var(--fast-soft);color:var(--fast);border-color:var(--fast)}
.actMuted{font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
table.sup tr.picked td:first-child{box-shadow:inset 3px 0 0 var(--accent)}

/* order-qty pushed to the right of the stats bar */
.bodyBar .qty{margin-left:auto}

/* rebate/help footer under the table */
.rebFoot{display:flex;align-items:flex-start;gap:7px;margin-top:11px;font-size:11.5px;color:var(--ink-faint);line-height:1.45}
.rebFoot svg{width:14px;height:14px;flex:none;margin-top:1px}
.rebFoot b{color:var(--ink-soft);font-weight:650}

/* hand-off owner subheader in the basket drawer */
.hoOwner{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650;color:var(--ink-soft);margin:12px 0 7px}

/* ---- validation checks ---- */
.checkBox{border:1px solid var(--ck);border-radius:var(--r-s);padding:11px 13px;margin-bottom:14px;background:var(--ckb)}
.checkBox.ok{--ck:var(--accent);--ckb:var(--accent-soft)}

const MONTHS=["Jul 25","Aug 25","Sep 25","Oct 25","Nov 25","Dec 25","Jan 26","Feb 26","Mar 26","Apr 26","May 26","Jun 26","Jul 26"];
const SECTIONS=[
 {id:"low", label:"Under 14 days", desc:"Running low",       cls:"low"},
 {id:"out", label:"Zero stock",    desc:"Already out",       cls:"out"},
 {id:"fast",label:"Selling fast",  desc:"Above expectation", cls:"fast"},
 {id:"slow",label:"Selling slow",  desc:"Below expectation", cls:"slow"}
];
/* ---------- helpers ---------- */
const net = x => x.price*(1-x.rebate/100);
const money = (v,d=2) => "£"+v.toFixed(d);
const pence = v => v<1 ? (v*100).toFixed(1)+"p" : "£"+v.toFixed(2);   // buyers talk in pence
const nfmt = v => v.toLocaleString("en-GB");
const bestOf = list => { const a=list.filter(x=>!x.oos); return a.length?a.reduce((b,x)=>net(x)<net(b)?x:b):null; };
const suggest = p => Math.max(0, Math.round(((p.avgDaily*30)-p.stock-p.onOrder)/100)*100);
const ratio = p => { const prev=p.m.slice(-7,-1); const avg=prev.reduce((a,b)=>a+b,0)/prev.length; return avg?p.m[p.m.length-1]/avg:1; };

/* ---------- data-quality: how old is a quoted price? ---------- */
const TODAY=new Date(2026,6,23);                       // 23 Jul 2026
const ageDays=d=>{const[a,b,c]=d.split("-").map(Number);
  return Math.round((TODAY-new Date(c,b-1,a))/864e5);};
const STALE=60;
const isStale=x=>ageDays(x.date)>STALE;

/* ---------- confidence: derived from demand volatility + data freshness ---------- */
function confidence(p){
  const r=p.m.slice(-6), mean=r.reduce((a,b)=>a+b,0)/r.length;
  const sd=Math.sqrt(r.reduce((a,b)=>a+(b-mean)**2,0)/r.length);
  let c=97-Math.min(20,Math.round((sd/(mean||1))*100*0.7));   // volatile demand → less certain
  if(p.sup.some(isStale)) c-=4;                                // stale prices → less certain
  if(!p.m.length) c-=10;
  return Math.max(68,Math.min(97,c));
}

/* ---------- the recommendation engine ----------
   Now product-based: compares ALL suppliers, then routes to whichever action
   fits — order from one of MY suppliers, or hand off to the owner of a cheaper
   supplier that isn't mine.                                                    */
function recommend(p){
  const bestAll =bestOf(p.sup);
  const bestMine=bestOf(p.sup.filter(x=>isMine(x.name)));
  const held=p.stock+p.newcastle, withInbound=held+p.onOrder;
  const coverNow=p.avgDaily?Math.round(held/p.avgDaily):999;
  const coverIn =p.avgDaily?Math.round(withInbound/p.avgDaily):999;
  const why=[], sig=sigs(p);
  const runOut=new Date(TODAY.getTime()+coverNow*864e5)
    .toLocaleDateString("en-GB",{day:"numeric",month:"long"});

  /* inbound stock rescues a short position — do not double-order. */
  if(p.onOrder>0 && coverNow<21 && coverIn>=21){
    why.push(`${nfmt(p.onOrder)} packs are already on order`);
    why.push(`Inbound stock raises cover to about ${coverIn} days`);
    if(sig.includes("fast")) why.push("Demand is running hot — keep watching, but no order needed yet");
    return{action:"monitor",label:"Monitor — no order needed",qty:0,sup:null,why,conf:confidence(p),tone:"ok"};
  }
  if(sig.includes("slow")){
    why.push(`Selling at ${Math.round(ratio(p)*100)}% of the expected rate`);
    why.push(`${coverNow} days of cover — well above target`);
    why.push("Likely a pricing issue — review before reordering");
    return{action:"review",label:"Review price — do not reorder",qty:0,sup:null,why,conf:confidence(p),tone:"warn"};
  }
  if(sig.includes("out")){
    why.push("No stock in Perivale or Newcastle");
    why.push("No inbound purchase order to cover the gap");
  }else{
    why.push(`${coverNow} days of cover at the current sales rate`);
    why.push(`Projected run-out is ${runOut}`);
    if(sig.includes("fast")) why.push(`Selling ${ratio(p).toFixed(1)}× expected — also review the sell price`);
  }
  const urgent=sig.includes("out")?"urgent":"ok";
  if(!bestAll) return{action:"handoff",label:"Every supplier is out of stock",qty:suggest(p),sup:null,why,conf:confidence(p),tone:"warn"};

  /* cheapest overall is one of mine → order it */
  if(isMine(bestAll.name)){
    why.push(`${bestAll.name} is your cheapest after rebate at ${money(net(bestAll),3)}`);
    return{action:"order",poSupplier:bestAll.name,sup:bestAll,
           label:`Order from ${short(bestAll.name)}`,qty:suggest(p),why,conf:confidence(p),tone:urgent};
  }
  /* cheapest overall belongs to another buyer */
  const owner=OWNER[bestAll.name];
  why.push(`Cheapest is ${bestAll.name} at ${money(net(bestAll),3)} — ${owner}'s account`);
  if(bestMine) why.push(`Your cheapest is ${short(bestMine.name)} at ${money(net(bestMine),3)}, ${pence(net(bestMine)-net(bestAll))} more`);
  return{action:"handoff",sup:bestAll,
         label:`Cheaper on ${owner}'s account (${short(bestAll.name)})`,qty:suggest(p),why,conf:confidence(p),tone:"warn"};
}

const state={filter:"all",section:"low",q:"",open:null};

/* products in scope: carried by ANY of my assigned suppliers (product-based),
   narrowed to one supplier when the secondary filter is set */
const carried = () => DATA.filter(p=> state.filter==="all"
  ? p.sup.some(x=>isMine(x.name))
  : p.sup.some(x=>x.name===state.filter));
/* ---------- which flags does a line raise? -----------------------------
   Derived from the data, never hand-labelled — so a line can never claim
   "selling fast" while its own numbers say otherwise.
   A line with NO flag never appears in the system at all.            */
const COVER_LOW=14, RATIO_FAST=1.5, RATIO_SLOW=0.6;
function sigs(p){
  const out=[], held=p.stock+p.newcastle, r=ratio(p);
  if(held<=0)                    out.push("out");
  else if(p.daysCover<COVER_LOW) out.push("low");
  if(held>0 && r>=RATIO_FAST)    out.push("fast");
  /* a line that is out of stock sells less BECAUSE it is out —
     that is not a pricing problem, so never call it slow */
  if(held>0 && r<=RATIO_SLOW)    out.push("slow");
  return out;
}
const primary = p => sigs(p)[0] || "low";
const inSec   = id => carried().filter(p=>sigs(p).includes(id));
const visible = () => {
  const q=state.q.trim().toLowerCase();
  return inSec(state.section).filter(p=> !q || p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q));
};

/* ---------- sparkline ---------- */
function spark(p){
  const w=150,h=30,pad=2,vals=p.m,mx=Math.max(...vals),mn=Math.min(...vals),rg=(mx-mn)||1;
  const col={low:"var(--low)",out:"var(--out)",fast:"var(--fast)",slow:"var(--slow)"}[primary(p)];
  const pts=vals.map((v,i)=>[pad+i*(w-pad*2)/(vals.length-1), h-pad-((v-mn)/rg)*(h-pad*2)]);
  const line=pts.map(([x,y],i)=>(i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)).join(" ");
  const area=line+` L${(w-pad).toFixed(1)} ${h} L${pad} ${h} Z`;
  const [lx,ly]=pts[pts.length-1];
  const gid="g"+p.code.replace(/\W/g,"");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="${col}" stop-opacity=".26"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.4" fill="${col}"/>
  </svg>`;
}

/* ---------- render: sidebar + tiles ---------- */
function renderNav(){
  document.getElementById("secNav").innerHTML=SECTIONS.map(sc=>{
    const n=inSec(sc.id).length;
    return `<button class="secBtn" data-sec="${sc.id}" aria-current="${state.section===sc.id}">
      <span class="dt ${sc.cls}"></span>${sc.label}<span class="ct">${n}</span></button>`;
  }).join("");
  document.getElementById("tiles").innerHTML=SECTIONS.map(sc=>{
    const n=inSec(sc.id).length;
    return `<button class="tile ${sc.cls}" data-sec="${sc.id}" aria-current="${state.section===sc.id}">
      <span class="tv">${n}</span><span class="tl">${sc.label}</span><span class="td">${sc.desc}</span></button>`;
  }).join("");
  const attn=carried().filter(p=>sigs(p).length>0).length;
  document.getElementById("attnCount").textContent=attn;
  document.getElementById("supCount").textContent=ASSIGNED.size;
  document.getElementById("filterNote").innerHTML=
    state.filter==="all" ? "" : ` · showing <b>${short(state.filter)}</b> only`;
  document.getElementById("listTitle").textContent=SECTIONS.find(x=>x.id===state.section).label;
}

/* ---------- render: list ---------- */
function renderList(){
  const rows=visible();
  const el=document.getElementById("list");
  if(!rows.length){
    el.innerHTML=`<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      <p>Nothing in this section${state.filter==="all"?"":` for ${state.filter}`}.</p></div>`;
    return;
  }
  el.innerHTML=rows.map(p=>{
    const best=bestOf(p.sup);
    const cover=Math.min(100,(p.daysCover/30)*100);
    const chip=id=>id==="out"?`<span class="badge out">Out of stock</span>`
      :id==="fast"?`<span class="badge fast">${ratio(p).toFixed(1)}× expected</span>`
      :id==="slow"?`<span class="badge slow">${Math.round(ratio(p)*100)}% of expected</span>`
      :`<span class="badge low">${p.daysCover} days left</span>`;
    const ordered=sigs(p).slice().sort(a=>a===state.section?-1:1);
    const badge=ordered.map(chip).join("");
    const rec=recommend(p);
    return `<article class="row ${primary(p)} ${state.open===p.code?"open":""}" data-code="${p.code}">
      <button class="rHead" aria-expanded="${state.open===p.code}">
        <div>
          <div class="pName">${p.name}</div>
          <div class="pCode">${p.code} · ${p.cat}</div>
        </div>
        <div>
          <div class="cLab">Stock</div>
          <div class="num">${nfmt(p.stock)}</div>
        </div>
        <div class="cover coverCell">
          <div class="cLab">Cover</div>
          ${badge}
          <div class="coverBar"><i style="width:${cover}%"></i></div>
        </div>
        <div class="sparkCell">
          <div class="cLab">13 mo</div>
          ${spark(p)}
        </div>
        <div class="bestBox bestCell">
          <div class="cLab">Best net price</div>
          <div class="bestSup">${best?best.name:"— none in stock —"}</div>
          ${best?`<div class="bestNet">${money(net(best),3)} <span style="color:var(--ink-faint);font-weight:500">from ${money(best.price)}</span></div>`:""}
        </div>
        <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
      </button>
      <div class="rBody"><div class="rBodyIn"><div class="bodyPad">
        <div class="recPanel ${rec.tone}">
          <div class="recMain">
            <div class="recTop">
              <span class="recTag ${rec.tone}">Recommended action</span>
              <span class="recConf" title="Confidence is derived from demand volatility and how fresh the supplier prices are">
                <span class="confBar"><i style="width:${rec.conf}%"></i></span>${rec.conf}% confidence
              </span>
            </div>
            <div class="recLabel">${rec.label}</div>
            ${rec.qty?`<div class="recQty">Suggested quantity <b>${nfmt(rec.qty)}</b> packs${rec.sup?` · ${rec.sup.name} at ${money(net(rec.sup),3)} net`:""}</div>`:""}
          </div>
          <div class="recWhy">
            <div class="whyTitle">Why this action</div>
            <ul>${rec.why.map(w=>`<li>${w}</li>`).join("")}</ul>
          </div>
        </div>
        <div class="bodyBar">
          <div class="kv"><span class="k">Perivale</span><span class="v">${nfmt(p.stock)}</span></div>
          <div class="kv"><span class="k">Newcastle</span><span class="v">${nfmt(p.newcastle)}</span></div>
          <div class="kv"><span class="k">On order</span><span class="v">${nfmt(p.onOrder)}</span></div>
          <div class="kv"><span class="k">Avg / day</span><span class="v">${nfmt(p.avgDaily)}</span></div>
          <div class="kv"><span class="k">Days cover</span><span class="v">${p.daysCover}</span></div>
        </div>
        <div class="tblWrap"><table class="sup">
          <thead><tr>
            <th>Supplier</th><th class="r">Price</th><th class="r">Rebate</th><th class="r">Net price</th>
            <th>Availability</th><th>Owner</th><th class="r">Updated</th>
          </tr></thead>
          <tbody>${p.sup.slice().sort((a,b)=>net(a)-net(b)).map(x=>{
            const mineRow=isMine(x.name);
            return `
            <tr class="${best&&x.name===best.name?"win":""} ${x.oos?"oos":""}">
              <td><span class="sName">${x.name}
                ${x.note?`<span class="tagMine">${x.note}</span>`:""}
                ${best&&x.name===best.name?`<span class="tagBest">Best net</span>`:""}
                ${mineRow?`<span class="tagMine">Mine</span>`:""}
              </span></td>
              <td class="r mono">${money(x.price)}</td>
              <td class="r mono">${x.rebate}%</td>
              <td class="r netv">${money(net(x),3)}</td>
              <td>${x.oos?`<span class="stat oos"><i class="d"></i>Out of stock</span>`:`<span class="stat in"><i class="d"></i>In stock</span>`}</td>
              <td><span class="init" title="${x.owner}">${x.init}</span></td>
              <td class="r mono" style="font-size:11px;color:var(--ink-faint)">${x.date}
                ${isStale(x)?`<span class="tagStale" title="Quoted ${ageDays(x.date)} days ago — may be out of date">${ageDays(x.date)}d old</span>`:""}</td>
            </tr>`;}).join("")}
          </tbody>
        </table></div>
        <div class="rebFoot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
          Net price = price after rebate, from the supplier rebate file. The cheapest in-stock supplier is tagged <b>Best net</b>.
        </div>
      </div></div></div>
    </article>`;
  }).join("");
}

const renderAll=()=>{renderNav();renderList();};

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const sec=e.target.closest("[data-sec]");
  if(sec){state.section=sec.dataset.sec;state.open=null;renderAll();return;}
  const head=e.target.closest(".rHead");
  if(head){
    const code=head.closest(".row").dataset.code;
    state.open=state.open===code?null:code;
    renderList();return;
  }
});
document.getElementById("supSel").innerHTML=
  `<option value="all"${state.filter==="all"?" selected":""}>All my suppliers</option>`+
  [...ASSIGNED].map(x=>`<option value="${esc(x)}"${x===state.filter?" selected":""}>${x}</option>`).join("");
document.getElementById("supSel").onchange=e=>{state.filter=e.target.value;state.open=null;renderAll();};
document.getElementById("q").oninput=e=>{state.q=e.target.value;renderList();};

renderAll();

<script>(function(){var root=document.documentElement,lbl=document.getElementById('themeLabel');
